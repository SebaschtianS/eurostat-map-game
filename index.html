<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Map Guessing Game</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="game-container">
    <h1>Guess the Europe Map!</h1>
    <h4>Can you tell what the following map shows without a legend?</h4>

    <div id="scoreboard">
      <span id="score">Score: 0</span>
      <span id="progress"></span>
    </div>

    <div class="map-wrapper">
        <img id="map" alt="Map">
    </div>

    <div id="choices"></div>

    <p id="feedback"></p>

    <button id="next" class="next-btn">Next Map</button>
  </div>

  <script src="script.js" defer></script>
</body>


</html>
